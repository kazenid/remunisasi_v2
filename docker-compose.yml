services:
  # ─── Application (PHP-FPM) ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sakai_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    networks:
      - sakai_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  # ─── Web Server (Nginx) ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sakai_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sakai_network
    depends_on:
      - app

  # ─── Database (MySQL) ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sakai_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sakai_laravel}
      MYSQL_USER: ${DB_USERNAME:-sakai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - sakai_mysql_data:/var/lib/mysql
    networks:
      - sakai_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache (Redis) ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sakai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sakai_redis_data:/data
    networks:
      - sakai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Queue Worker ──────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sakai_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - sakai_network
    depends_on:
      - app
      - redis

volumes:
  sakai_mysql_data:
    driver: local
  sakai_redis_data:
    driver: local

networks:
  sakai_network:
    driver: bridge
