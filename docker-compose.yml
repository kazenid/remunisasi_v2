services:
  # ─── Application (PHP-FPM 8.4) ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sakai_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - sakai_storage:/var/www/storage
    networks:
      - sakai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  # ─── Web Server (Nginx) ────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: sakai_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - sakai_storage:/var/www/storage:ro # Read-only access to storage for symlinked public assets
    networks:
      - sakai_network
    depends_on:
      - app

  # ─── Database (PostgreSQL) ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sakai_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sakai_laravel}
      POSTGRES_USER: ${DB_USERNAME:-sakai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - sakai_postgres_data:/var/lib/postgresql/data
    networks:
      - sakai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sakai} -d ${DB_DATABASE:-sakai_laravel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache (Redis) ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sakai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sakai_redis_data:/data
    networks:
      - sakai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Queue Worker ──────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sakai_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - sakai_storage:/var/www/storage
    networks:
      - sakai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sakai_postgres_data:
    driver: local
  sakai_redis_data:
    driver: local
  sakai_storage:
    driver: local

networks:
  sakai_network:
    driver: bridge
