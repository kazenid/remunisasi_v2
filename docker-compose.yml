services:
  # ─── Application (PHP-FPM 8.4) ─────────────────────────────────────────
  # MySQL, Redis, dan DB SIKEP TIDAK dijalankan sebagai container.
  # - MySQL aplikasi  : berjalan di host Linux        → akses via host.docker.internal
  # - Redis           : berjalan di host Linux        → akses via host.docker.internal
  # - DB SIKEP (MySQL): berjalan di server LAIN       → akses via IP/host SIKEP_DB_HOST
  # Semua kredensial & host diambil dari .env (lihat .env.example).
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sakai_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - sakai_storage:/var/www/storage
    networks:
      - sakai_network
    # Memetakan host.docker.internal ke IP gateway host (Linux tidak
    # menyediakannya secara default seperti Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  # ─── Web Server (Nginx) ────────────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: sakai_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - sakai_storage:/var/www/storage:ro # Read-only access to storage for symlinked public assets
    networks:
      - sakai_network
    depends_on:
      - app

  # ─── Queue Worker ──────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sakai_queue
    restart: unless-stopped
    # Jalan sebagai www-data agar laravel.log di volume bersama tidak dibuat root
    # (yang akan memblokir tulis oleh php-fpm/www-data).
    user: www-data
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - sakai_storage:/var/www/storage
    networks:
      - sakai_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app

volumes:
  sakai_storage:
    driver: local

networks:
  sakai_network:
    driver: bridge
