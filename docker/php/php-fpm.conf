[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
; Tiap klien SSE menahan satu worker php-fpm sepanjang koneksi terbuka.
; Naikkan kapasitas agar koneksi SSE tidak menghabiskan pool; sesuaikan RAM.
; Pemisahan pool khusus SSE dicatat sebagai peningkatan opsional (desain §10.2).
; Perkiraan RAM = jumlah worker x ~40 MB; satu tab browser = satu worker permanen.
; Syarat: min_spare <= start_servers <= max_spare.
pm.max_children = 128
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 40
pm.max_requests = 500
; Batas atas umur request, sedikit di atas nginx fastcgi_read_timeout (3600s),
; agar worker SSE tidak dibunuh di tengah koneksi sah namun tetap punya batas.
request_terminate_timeout = 3700
