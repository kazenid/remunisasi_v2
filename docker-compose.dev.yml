services:
  # ─── Application (PHP 8.4-FPM) ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: sakai_app_dev
    working_dir: /var/www
    volumes:
      - .:/var/www
      - sakai_vendor_dev:/var/www/vendor
      - sakai_node_modules_dev:/var/www/node_modules
    ports:
      - "9000:9000"
    networks:
      - sakai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php-fpm"

  # ─── Vite Dev Server (HMR) ─────────────────────────────────────────────────
  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: sakai_vite_dev
    working_dir: /var/www
    volumes:
      - .:/var/www
      - sakai_node_modules_dev:/var/www/node_modules
    ports:
      - "5173:5173"
    networks:
      - sakai_network
    depends_on:
      - app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # ─── Web Server (Nginx) ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sakai_nginx_dev
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sakai_network
    depends_on:
      - app

  # ─── Database (PostgreSQL 16) ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sakai_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sakai_laravel
      POSTGRES_USER: sakai
      POSTGRES_PASSWORD: secret
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - sakai_postgres_dev_data:/var/lib/postgresql/data
    networks:
      - sakai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakai -d sakai_laravel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache (Redis 7) ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sakai_redis_dev
    ports:
      - "6379:6379"
    networks:
      - sakai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sakai_postgres_dev_data:
  sakai_vendor_dev:
  sakai_node_modules_dev:

networks:
  sakai_network:
    driver: bridge
